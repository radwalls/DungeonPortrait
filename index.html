<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Dungeon Portrait Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game-root">
      <canvas id="game" aria-label="Dungeon gameplay"></canvas>

      <div id="ui">
        <button class="menu-btn" id="character-btn">Character</button>
        <button class="menu-btn" id="inventory-btn">Inventory</button>
      </div>

      <section id="menu-screen" hidden>
        <div class="menu-content">
          <h1 id="menu-title"></h1>
          <div id="menu-body"></div>
          <button id="close-menu">Return to Dungeon</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
