<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dungeon Descent: Portrait Crawler</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game" id="game">
    <header class="hud">
      <div class="hud__row">
        <div><strong>Depth:</strong> <span id="depth">1</span></div>
        <div><strong>HP:</strong> <span id="hp">100</span></div>
      </div>
      <div class="hud__row">
        <div><strong>Gold:</strong> <span id="gold">0</span></div>
        <div><strong>Gear:</strong> <span id="gearLevel">1</span></div>
      </div>
      <div class="xp-wrap">
        <label for="xpBar">Progress</label>
        <progress id="xpBar" max="100" value="0"></progress>
      </div>
    </header>

    <section class="view" id="view">
      <div class="tunnel" id="tunnel"></div>
      <div class="event-card" id="eventCard">
        <h1 id="eventTitle">Enter the Dungeon</h1>
        <p id="eventText">Swipe up to descend into the dark.</p>
        <div id="combatZone" class="combat-zone hidden">
          <div class="timing-track">
            <div class="timing-sweet"></div>
            <div class="timing-marker" id="timingMarker"></div>
          </div>
          <button id="strikeBtn" class="strike-btn">Strike!</button>
          <small>Tap when the marker passes the glowing zone.</small>
        </div>
        <div id="choiceZone" class="choice-zone"></div>
      </div>
    </section>

    <footer class="controls">
      <button id="descendBtn" class="primary">Descend (Swipe Up)</button>
      <button id="restartBtn" class="secondary hidden">Start New Run</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
